<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
</head>
<body>
<!--MODAL-->
    <div id="myModal" class="modal">
        <span class="close">
            X
        </span>
        
        <img class="modal-content" id="modal-img" src="images/attention-error.png">
        <div id="modal-text">placeholder</div>
    </div>
<!--MODAL-->
    <a href="index.html" class="button" target="_self">Back</a> <!-- Back button -->

    <link rel="stylesheet" href="gallery-stylesheet.css"> <!-- Link to the CSS file --> 
    <script src="image-gallery-script.js" defer></script> <!-- Link to the JavaScript file -->
    <!-- Title and description of the gallery -->
    <div id="page-title">
        <h1>My Art Gallery</h1>
        <p>Here are some of my favorite pieces of art that I've created over the years.</p>
    </div>

    <div class="image-gallery">
        <div class="art-piece">
            <img src="images/ResplendentQuetzal.jpeg" alt="Art Piece 1" width="300" height="200">
            <p>Title: Resplendent Quetzal</p>
        </div>
        <div class="art-piece">
            <img src="images/BlueventedHummingbird.JPG" alt="Art Piece 1" width="300" height="200">
            <p>Title: Bluevented-Hummingbird</p>
        </div>
        <div class="art-piece">
            <img src="images/Callicore_texa_titani.JPG" alt="Art Piece 1" width="300" height="200">
            <p>Title: Callicore texa titani</p>
        </div>
        <div class="art-piece">
            <img src="images/BlackcheekedWoodpecker.JPG" alt="Art Piece 1" width="300" height="200">
            <p>Title: Blackcheeked-Woodpecker</p>
        </div>
        <div class="art-piece">
            <img src="images/StrawberryPoisonDartFrog.JPG" alt="Art Piece 1" width="300" height="200">
            <p>Title: Strawberry Poison Dart Frog</p>
        </div>
    </div>
</body>
</html>
